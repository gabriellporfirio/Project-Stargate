<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Computer side</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#06080F}
@keyframes uUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes uDots{0%,80%,100%{opacity:.2}40%{opacity:1}}
@keyframes uGrow{from{width:0}}
.u-up{animation:uUp .4s ease both}
.u-dot{animation:uDots 1.2s infinite}.u-dot2{animation-delay:.2s}.u-dot3{animation-delay:.4s}
.u-grow{animation:uGrow 1.4s cubic-bezier(.2,.8,.2,1) both}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</helmet>
<div style="width: 100%; min-height: 800px; box-sizing: border-box; background: radial-gradient(90% 70% at 80% 0%, rgba(94,234,212,.07) 0%, rgba(6,8,15,0) 60%), #06080F; color: #E6EAF2; font-family: 'Space Grotesk', system-ui, sans-serif; display: flex; flex-wrap: wrap">

<nav aria-label="Menu" style="flex: 0 0 224px; box-sizing: border-box; padding: 28px 16px 20px; border-right: 1px solid #1E2638; display: flex; flex-direction: column; gap: 6px">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="2"><button type="button" onClick="{{t.go}}" style="{{t.style}}">{{t.name}}</button></sc-for>
<div style="margin-top: auto; display: flex; align-items: center; justify-content: center; gap: 10px"><img src="logo-light.png" width="30" height="30" alt="" style="display: block; opacity: .9"><span style="{{linkStyle}}">● {{linkLabel}}</span></div>
<span style="padding-top: 6px; text-align: center; font-size: 10px; color: #4E5870">Mockup · example data only</span>
</nav>

<main style="flex: 1 1 600px; box-sizing: border-box; padding: 28px 36px; display: flex; flex-direction: column; gap: 18px">

<sc-if value="{{tFiles}}">
<div class="u-up" style="display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap">
<div style="display: flex; flex-direction: column; gap: 4px"><h2 style="margin: 0; font-size: 32px; font-weight: 600">Files</h2><span style="font-size: 14px; color: #A7B0C4">{{filesSub}}</span></div>
<span style="font-size: 13px; color: #A7B0C4">41 GB free of 64 GB</span>
</div>
<button type="button" onClick="{{upload}}" class="u-up" style="{{dropStyle}}">
<span style="font-size: 28px" aria-hidden="true">⇪</span>
<span style="font-size: 16px; font-weight: 600">{{dropLabel}}</span>
<span style="font-size: 13px; color: #8A94AB">or click to choose files</span>
<sc-if value="{{uploading}}"><span style="width: 60%; height: 6px; border-radius: 99px; background: #1E2638; overflow: hidden; display: block"><span class="u-grow" style="display: block; height: 100%; width: 100%; background: linear-gradient(90deg, #5EEAD4, #818CF8)"></span></span></sc-if>
</button>
<div style="display: flex; flex-direction: column; border: 1px solid #1E2638; border-radius: 14px; overflow: hidden">
<sc-for list="{{files}}" as="f" hint-placeholder-count="4">
<div class="{{f.cls}}" style="display: flex; align-items: center; gap: 14px; padding: 12px 16px; border-bottom: 1px solid #1E2638; background: rgba(15,22,40,.6); font-size: 14px">
<span style="color: #5EEAD4" aria-hidden="true">▤</span><span style="flex: 1">{{f.name}}</span><span style="color: #8A94AB; font-family: 'JetBrains Mono', monospace; font-size: 12px">{{f.size}}</span><span style="{{f.tagStyle}}">{{f.tag}}</span>
</div>
</sc-for>
</div>
</sc-if>

<sc-if value="{{tAsst}}">
<div class="u-up" style="display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap">
<div style="display: flex; flex-direction: column; gap: 4px"><h2 style="margin: 0; font-size: 32px; font-weight: 600">Assistant</h2><span style="font-size: 14px; color: #A7B0C4">{{asstSub}}</span></div>
<div role="group" aria-label="Model" style="display: grid; grid-template-columns: 1fr 1fr; gap: 4px; background: #0B1020; border-radius: 12px; padding: 4px; min-width: 300px">
<button type="button" onClick="{{pickLocal}}" style="{{localStyle}}">On the phone</button>
<button type="button" onClick="{{pickCloud}}" style="{{cloudStyle}}">Cloud</button>
</div>
</div>
<div style="flex: 1; min-height: 360px; display: flex; flex-direction: column; gap: 12px; padding: 18px; border-radius: 16px; background: rgba(15,22,40,.85); border: 1px solid #1E2638">
<span style="align-self: flex-end; max-width: 70%; background: #5EEAD4; color: #06080F; border-radius: 14px 14px 2px 14px; padding: 10px 14px; font-size: 15px">Give me a 3-item packing list for a rainy day hike.</span>
<sc-if value="{{thinking}}"><span style="align-self: flex-start; font-size: 24px; color: #8A94AB"><span class="u-dot">•</span><span class="u-dot u-dot2">•</span><span class="u-dot u-dot3">•</span></span></sc-if>
<sc-if value="{{answered}}">
<div class="u-up" style="align-self: flex-start; max-width: 75%; display: flex; flex-direction: column; gap: 6px">
<span style="background: #1E2638; border-radius: 14px 14px 14px 2px; padding: 10px 14px; font-size: 15px; line-height: 1.5">{{answer}}</span>
<span style="font-size: 12px; color: #8A94AB">{{stats}}</span>
</div>
</sc-if>
</div>
<button type="button" onClick="{{ask}}" style="align-self: flex-end; min-height: 48px; padding: 0 28px; border-radius: 12px; border: 0; background: linear-gradient(90deg, #5EEAD4, #818CF8); color: #06080F; font-family: inherit; font-size: 15px; font-weight: 700; cursor: pointer">Ask</button>
</sc-if>

</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { tab: 'files', up: 'idle', mode: 'local', chat: 'idle', wifi: true }; }
  componentWillUnmount() { if (this.t) clearTimeout(this.t); }
  renderVals() {
    const st = this.state, local = st.mode === 'local';
    const seg = (on) => 'min-height: 44px; border-radius: 9px; border: 0; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer; background: ' + (on ? '#5EEAD4' : 'transparent') + '; color: ' + (on ? '#06080F' : '#A7B0C4');
    const tabs = [['files', 'Files'], ['asst', 'Assistant']].map(t => ({ name: t[1], go: () => this.setState({ tab: t[0] }), style: 'min-height: 44px; text-align: left; padding: 0 14px; border-radius: 10px; font-family: inherit; font-size: 15px; cursor: pointer; color: #E6EAF2; border: 1px solid ' + (st.tab === t[0] ? '#5EEAD4' : 'transparent') + '; background: ' + (st.tab === t[0] ? 'rgba(94,234,212,.08)' : 'transparent') }));
    const base = [['holiday-photos.zip', '1.2 GB'], ['tax-2025.pdf', '480 KB'], ['recipes.md', '12 KB']];
    const list = (st.up === 'done' ? [['new-scans.zip', '86 MB', true]] : []).concat(base);
    const files = list.map((f, i) => ({ name: f[0], size: f[1], tag: f[2] ? 'Just now' : '', cls: f[2] ? 'u-up' : '', tagStyle: f[2] ? 'font-size: 11px; padding: 3px 8px; border-radius: 99px; background: #13283A; color: #5EEAD4' : 'display: none' }));
    return {
      toggleLink: () => this.setState({ wifi: !st.wifi }),
      linkStyle: 'font-size: 13px; white-space: nowrap; color: ' + (st.wifi ? '#5EEAD4' : '#F2B66D'),
      linkLabel: st.wifi ? 'Connected over Wi-Fi' : 'Connected by cable',
      linkNote: st.wifi ? 'Paired. Same home network.' : 'Phone network is off: cable only.',
      filesSub: st.wifi ? 'Stored on the phone. Reachable from paired computers on your Wi-Fi, or by cable.' : 'Stored on the phone. The phone network is off, so this works through the cable only.',
      tabs, tFiles: st.tab === 'files', tAsst: st.tab === 'asst',
      uploading: st.up === 'busy',
      dropLabel: st.up === 'busy' ? 'Sending new-scans.zip to the phone…' : st.up === 'done' ? 'Sent. Drop more files here' : 'Drop files here to keep them on the phone',
      dropStyle: 'min-height: 150px; border-radius: 16px; border: 1.5px dashed ' + (st.up === 'busy' ? '#5EEAD4' : '#2A3550') + '; background: rgba(15,22,40,.6); color: #E6EAF2; font-family: inherit; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; cursor: pointer',
      upload: () => { if (st.up === 'busy') return; this.setState({ up: 'busy' }); this.t = setTimeout(() => this.setState({ up: 'done' }), 1600); },
      files,
      asstSub: local ? 'Llama 3.2 1B, running on the phone. Works even with the phone network off.' : 'Muse Spark Open, hosted on Baseten. Needs internet and your key.',
      localStyle: seg(local), cloudStyle: seg(!local),
      pickLocal: () => this.setState({ mode: 'local', chat: 'idle' }), pickCloud: () => this.setState({ mode: 'cloud', chat: 'idle' }),
      thinking: st.chat === 'busy', answered: st.chat === 'done',
      answer: local ? 'Waterproof jacket, spare socks in a zip bag, and a small snack.' : '1. A waterproof shell with a hood. 2. Dry socks sealed in a zip bag. 3. A light, high-energy snack. Bonus: check when the trail closes before you set off.',
      stats: local ? 'On the phone · offline · 26 tokens · 0.7 s' : 'Muse Spark Open · Baseten · 1.4 s',
      ask: () => { this.setState({ chat: 'busy' }); this.t = setTimeout(() => this.setState({ chat: 'done' }), local ? 900 : 1400); }
    };
  }
}
</script>
</body>
</html>
