# Tooling configuration only. The app is not a pip-installable package: the
# app/ folder ships as _app/ and runs from there (see README).

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["app"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
# Ruff's default rule set (pyflakes and core pycodestyle errors). Formatting
# is not enforced so imported code keeps its original layout.
select = ["E4", "E7", "E9", "F"]
