name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install ruff
        run: python -m pip install "$(grep '^ruff==' requirements-dev.txt)"
      - run: ruff check --output-format=github .

  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The portable build targets Windows; Linux also covers the ffprobe path.
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          # Must match the Python bundled in _runtime.
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install ffprobe and a virtual display
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg xvfb
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run tests
        if: runner.os != 'Linux'
        run: python -m pytest
      - name: Run tests (virtual display for the Tk smoke tests)
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m pytest

  launcher:
    name: Launcher
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install MinGW-w64 and Wine
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-mingw-w64-x86-64 binutils-mingw-w64-x86-64 wine wine64
      - name: Command-line quoting tests
        run: make -C launcher test
      - name: Build
        run: make -C launcher
      - name: Behaviour tests under Wine
        run: make -C launcher wine-test
      - uses: actions/upload-artifact@v4
        with:
          name: launcher
          path: launcher/build/launcher.exe
          if-no-files-found: error
