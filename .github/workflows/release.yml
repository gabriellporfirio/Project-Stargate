name: Release

# Builds the portable Windows folder and smoke-tests it on Windows.
#   - pull requests that touch the build: build and test only
#   - manual run: build, test and keep the zip as a workflow artifact
#   - tag vX.Y (e.g. v1.0), or a release published on GitHub: also attach the
#     zip to that GitHub release, creating the release if it doesn't exist
on:
  push:
    tags: ["v*"]
  release:
    types: [published]
  pull_request:
    paths:
      - "packaging/**"
      - "launcher/**"
      - "requirements.txt"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: read

# Publishing a release on GitHub with a new tag fires both the tag push and
# the release event; keep only the latest run for the same tag.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  # Python bundled in _runtime. The launcher expects Tcl/Tk 8.6 (Python 3.12).
  PYTHON_VERSION: "3.12"
  # Windows FFmpeg build that ffprobe.exe is taken from (https://www.gyan.dev/ffmpeg/builds/).
  # When changing the URL, update the checksum too; the build prints the new one.
  FFMPEG_URL: https://github.com/GyanD/codexffmpeg/releases/download/7.1.1/ffmpeg-7.1.1-essentials_build.zip
  FFMPEG_SHA256: 04861d3339c5ebe38b56c19a15cf2c0cc97f5de4fa8910e4d47e5e6404e4a2d4

jobs:
  launcher:
    name: Build launcher
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install MinGW-w64
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64 binutils-mingw-w64-x86-64
      - run: make -C launcher
      - uses: actions/upload-artifact@v4
        with:
          name: launcher
          path: launcher/build/launcher.exe
          if-no-files-found: error

  bundle:
    name: Build and test portable folder
    needs: launcher
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/download-artifact@v4
        with:
          name: launcher
          path: launcher/build
      - name: Build
        run: >-
          python packaging/build_portable.py --zip
          --ffprobe-url "${{ env.FFMPEG_URL }}"
          --ffprobe-sha256 "${{ env.FFMPEG_SHA256 }}"
          --expect-version "${{ github.ref_type == 'tag' && github.ref_name || '' }}"
      - name: Smoke test
        run: python packaging/smoke_test.py "dist/Pixel Media Checker"
      - uses: actions/upload-artifact@v4
        with:
          name: portable-build
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish release
    if: github.ref_type == 'tag'
    needs: bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: portable-build
      - name: Attach the zip to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" *.zip --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" *.zip --repo "$GITHUB_REPOSITORY" \
              --title "Pixel Media Checker $TAG" --generate-notes
          fi
